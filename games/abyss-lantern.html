<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>심연의 등불</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Song+Myung&display=swap">
<style>
:root {
  /* 레이아웃: 전체화면 3D 캔버스 + 가장자리 고정 HUD + 왼쪽 정렬 메뉴 화면. 강조색은 등불의 호박색 하나, 나머지는 청흑색 돌의 중성색 */
  --ink: #06080c;
  --slab: #0f131b;
  --slab-2: #161b25;
  --rule: #283040;
  --paper: #e0d7c6;
  --dim: #8e909a;
  --faint: #5a5f6b;
  --amber: #f2b158;
  --ember: #e4682c;
  --blood: #d8443a;
  --soul: #86b4ea;
  --rare: #6ea6ff;
  --epic: #c385ff;
  --moss: #79c08a;
  --f-display: "Song Myung", "Nanum Myeongjo", "Batang", serif;
  --f-latin: "Cinzel", "Song Myung", Georgia, serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--paper); overflow: hidden; }
body { font-family: var(--f-body); font-size: 14px; word-break: keep-all; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; overscroll-behavior: none; }
button { font: inherit; color: inherit; }
#root { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; background: #000; touch-action: none; cursor: crosshair; }
kbd { font: 500 10.5px var(--f-mono); display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 4px; border: 1px solid rgba(224,215,198,.4); border-bottom-width: 2px; border-radius: 3px; color: var(--paper); background: rgba(0,0,0,.35); }

/* ── 떠다니는 숫자 · 적 체력 ── */
#fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.dn { position: absolute; left: 0; top: 0; font: 600 16px/1 var(--f-mono); color: #fff1dd; white-space: nowrap; text-shadow: 0 1px 0 #000, 0 0 8px rgba(0,0,0,.9); will-change: transform, opacity; }
.dn.crit { color: var(--amber); font-size: 22px; }
.dn.hurt { color: #ff6b5e; font-size: 18px; }
.dn.heal { color: var(--moss); }
.dn.burn { color: #ff9a4a; font-size: 13px; }
.dn.poison { color: #9be06a; font-size: 13px; }
.dn.info { color: var(--soul); font: 500 13px var(--f-body); }
.dn.gold { color: #f6d36a; font-size: 14px; }
.dn.miss { color: var(--dim); font: 500 13px var(--f-body); }
.ehp { position: absolute; left: 0; top: 0; width: 40px; height: 4px; background: rgba(0,0,0,.7); box-shadow: 0 0 0 1px rgba(0,0,0,.85); }
.ehp b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blood); }
.ehp i { position: absolute; left: 0; top: 0; bottom: 0; background: #f4e3c4; opacity: .55; transition: width .4s .1s; }
.ehp.elite b { background: #ff9a3a; }

/* ── HUD ── */
#hud { position: absolute; inset: 0; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.85); }
.hud-tl { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); top: max(16px, env(safe-area-inset-top, 0px)); display: grid; gap: 7px; width: min(300px, 58vw); }
.plate { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.plate b { font: 700 46px/1 var(--f-latin); color: var(--amber); text-shadow: 0 0 22px rgba(242,177,88,.35), 0 2px 0 #000; min-width: 34px; }
.plate span { display: grid; gap: 2px; }
.plate small { font: 500 11px var(--f-mono); letter-spacing: .2em; color: var(--dim); }
.plate em { font: 400 18px/1.1 var(--f-display); font-style: normal; color: var(--paper); }
.vit { display: grid; grid-template-columns: 30px minmax(0, 1fr) 44px; align-items: center; gap: 8px; font-size: 11.5px; color: var(--dim); }
.vit .num { font: 600 12.5px var(--f-mono); color: var(--paper); text-align: right; font-variant-numeric: tabular-nums; }
.vit.low .num { color: #ff7b6e; }
.bar { position: relative; height: 9px; background: rgba(255,255,255,.07); box-shadow: inset 0 0 0 1px rgba(0,0,0,.6); overflow: hidden; }
.bar b, .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform-origin: 0 50%; }
.bar i { background: #f6e6c8; opacity: .5; transition: transform .45s .15s ease-out; }
.bar b { z-index: 1; }
.bar.hp b { background: linear-gradient(#e85a4c, #a92c25); }
.bar.oil b { background: linear-gradient(#ffd27a, #c9832c); }
.bar.oil.low b { background: linear-gradient(#ff8a4a, #b0401c); animation: pulse 1s infinite; }
.bar.xp { height: 4px; }
.bar.xp b { background: var(--soul); }
.bar::after { content: ""; position: absolute; inset: 0; z-index: 2; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(0,0,0,.45) calc(10% - 1px) 10%); }
.bar.xp::after { display: none; }
.xpl { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 8px; font: 600 11px var(--f-mono); color: var(--soul); }
.status { display: flex; gap: 6px; flex-wrap: wrap; min-height: 0; }
.st { font-size: 11px; padding: 2px 7px; border: 1px solid rgba(255,255,255,.18); background: rgba(5,7,10,.55); }
.st.burn { color: #ffae6a; border-color: rgba(255,140,60,.5); }
.st.poison { color: #a6e47a; border-color: rgba(140,220,90,.5); }
.st.slow { color: #8fc0ff; border-color: rgba(110,160,255,.5); }
.st.buff { color: var(--amber); border-color: rgba(242,177,88,.5); }
.mod { font-size: 12px; padding: 4px 9px; width: max-content; max-width: 100%; border-left: 2px solid var(--ember); background: rgba(40,14,6,.55); color: #ffcfae; }
.hud-tr { position: absolute; right: max(18px, env(safe-area-inset-right, 0px)); top: max(16px, env(safe-area-inset-top, 0px)); display: grid; gap: 6px; justify-items: end; }
#minimap { width: 176px; height: 176px; background: rgba(4,6,9,.6); box-shadow: 0 0 0 1px rgba(224,215,198,.14); }
.purse { display: flex; gap: 14px; font: 600 13px var(--f-mono); }
.purse .g { color: #f6d36a; }
.purse .s { color: var(--soul); }
.purse .k { color: var(--dim); }
.hud-bl { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; align-items: flex-end; }
.slot { position: relative; width: 56px; height: 56px; display: grid; place-items: center; background: rgba(6,8,12,.72); box-shadow: 0 0 0 1px rgba(224,215,198,.2); color: var(--paper); overflow: hidden; }
.slot svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; position: relative; z-index: 1; }
.slot .k { position: absolute; left: 4px; top: 3px; font: 500 10px var(--f-mono); color: var(--dim); z-index: 2; }
.slot .n { position: absolute; right: 5px; bottom: 3px; font: 600 12px var(--f-mono); z-index: 2; }
.slot .cd { position: absolute; inset: 0; background: conic-gradient(rgba(0,0,0,.72) calc(var(--p, 0) * 1turn), transparent 0); z-index: 1; }
.slot .ct { position: absolute; inset: 0; display: grid; place-items: center; font: 600 15px var(--f-mono); z-index: 3; color: #fff; }
.slot.skill { width: 64px; height: 64px; box-shadow: 0 0 0 1px rgba(242,177,88,.55); color: var(--amber); }
.slot.ready { animation: ready .6s ease-out; }
.slot.empty { opacity: .38; }
.slot.sep { margin-left: 10px; }
@keyframes ready { 0% { box-shadow: 0 0 0 1px var(--amber), 0 0 22px rgba(242,177,88,.9); } 100% { box-shadow: 0 0 0 1px rgba(242,177,88,.55); } }
@keyframes pulse { 50% { opacity: .45; } }
#bossbar { position: absolute; left: 50%; top: max(22px, env(safe-area-inset-top, 0px)); transform: translateX(-50%); width: min(560px, 46vw); text-align: center; display: grid; gap: 6px; }
#bossbar .nm { font: 400 21px var(--f-display); color: #f3d6ff; text-shadow: 0 0 14px rgba(170,90,255,.55), 0 1px 2px #000; }
#bossbar .bar { height: 11px; }
#bossbar .bar b { background: linear-gradient(#c084ff, #6d33c4); }
#bossbar .ph { font: 500 11px var(--f-mono); color: var(--dim); letter-spacing: .1em; }
#prompt { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; padding: 6px 12px; background: rgba(5,7,10,.72); box-shadow: 0 0 0 1px rgba(242,177,88,.35); font-size: 14px; white-space: nowrap; }
#toasts { position: absolute; left: 50%; top: 21%; transform: translateX(-50%); display: grid; gap: 4px; justify-items: center; font-size: 14px; }
.toast { background: rgba(5,7,10,.66); padding: 5px 14px; animation: toast 2.8s ease forwards; white-space: nowrap; }
.toast.gold { color: #f6d36a; } .toast.red { color: #ff8b7e; } .toast.green { color: #9be3b0; } .toast.blue { color: var(--soul); } .toast.amber { color: var(--amber); }
@keyframes toast { 0% { opacity: 0; transform: translateY(6px); } 10%, 78% { opacity: 1; transform: none; } 100% { opacity: 0; } }
#hint { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); width: max-content; max-width: min(560px, 88vw); text-align: center; font-size: 14px; line-height: 1.6; background: rgba(5,7,10,.78); border-top: 2px solid var(--amber); padding: 9px 16px 10px; }
.card-intro { position: absolute; left: 50%; top: 25%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; display: grid; gap: 8px; justify-items: center; animation: intro 4.4s ease forwards; width: min(92vw, 640px); }
.card-intro .f { font: 700 clamp(70px, 14vh, 128px)/.9 var(--f-latin); color: var(--amber); text-shadow: 0 0 40px rgba(242,177,88,.35); }
.card-intro .n { font: 400 24px var(--f-display); letter-spacing: .12em; }
.card-intro .m { font-size: 14px; color: #ffcfae; max-width: 44ch; line-height: 1.5; }
.card-intro.boss .f { color: #d6a6ff; text-shadow: 0 0 40px rgba(170,90,255,.5); font-size: clamp(34px, 6.5vh, 58px); font-family: var(--f-display); font-weight: 400; }
@keyframes intro { 0% { opacity: 0; transform: translate(-50%, -46%); } 12%, 76% { opacity: 1; transform: translate(-50%, -50%); } 100% { opacity: 0; transform: translate(-50%, -52%); } }

/* ── 터치 조작 ── */
#touch { position: absolute; inset: 0; pointer-events: none; }
#joyZone { position: absolute; left: 0; bottom: 0; width: 48%; height: 62%; pointer-events: auto; touch-action: none; }
#joyBase { position: absolute; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; border: 1px solid rgba(224,215,198,.28); background: radial-gradient(rgba(0,0,0,.15), rgba(0,0,0,.42)); opacity: .55; transition: opacity .15s; }
#joyBase.on { opacity: 1; }
#joyKnob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: rgba(224,215,198,.22); box-shadow: 0 0 0 1px rgba(224,215,198,.5); }
.tbtns { position: absolute; right: max(14px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); width: 210px; height: 210px; pointer-events: none; }
.tb { position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%; border: 1px solid rgba(224,215,198,.35); background: rgba(8,10,14,.55); color: var(--paper); display: grid; place-items: center; font-size: 11.5px; font-weight: 700; overflow: hidden; }
.tb svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; position: relative; z-index: 1; }
.tb.on { background: rgba(242,177,88,.3); }
.tb .cd { position: absolute; inset: 0; background: conic-gradient(rgba(0,0,0,.7) calc(var(--p, 0) * 1turn), transparent 0); }
.tb .n { position: absolute; right: 9px; bottom: 6px; font: 600 11px var(--f-mono); z-index: 2; }
#tAtk { right: 0; bottom: 0; width: 92px; height: 92px; border-color: rgba(242,177,88,.6); color: var(--amber); }
#tAtk svg { width: 34px; height: 34px; }
#tDodge { right: 104px; bottom: 4px; width: 62px; height: 62px; }
#tSkill { right: 12px; bottom: 104px; width: 64px; height: 64px; color: var(--amber); border-color: rgba(242,177,88,.5); }
#tI1 { right: 98px; bottom: 82px; width: 48px; height: 48px; }
#tI2 { right: 150px; bottom: 66px; width: 44px; height: 44px; }
#tI3 { right: 86px; bottom: 138px; width: 44px; height: 44px; }
#tUse { right: 0; bottom: 182px; width: auto; min-width: 92px; height: 40px; border-radius: 20px; padding: 0 14px; background: rgba(242,177,88,.85); color: #1b1006; border: 0; }
#tPause { position: absolute; pointer-events: auto; right: max(14px, env(safe-area-inset-right, 0px)); top: calc(max(16px, env(safe-area-inset-top, 0px)) + 206px); width: 40px; height: 40px; border-radius: 6px; border: 1px solid rgba(224,215,198,.3); background: rgba(8,10,14,.55); color: var(--paper); font: 700 13px var(--f-mono); }

/* ── 화면(메뉴) ── */
.screen { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-top: max(24px, env(safe-area-inset-top, 0px)); padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.screen.dim { background: rgba(5,7,10,.86); }
.screen.veil { background: radial-gradient(ellipse at 50% 50%, rgba(5,7,10,.55), rgba(5,7,10,.92) 75%); }
.title-screen { background: linear-gradient(90deg, rgba(5,7,10,.95) 0%, rgba(5,7,10,.72) 40%, rgba(5,7,10,0) 72%); }
.title-col { max-width: 520px; min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding-left: clamp(0px, 4vw, 64px); }
.eyebrow { font: 500 11.5px var(--f-mono); letter-spacing: .2em; color: var(--amber); text-transform: uppercase; margin: 0; }
.logo { margin: 0; display: grid; gap: 4px; }
.logo b { font: 400 clamp(64px, 13vh, 120px)/.95 var(--f-display); color: #ffdca6; text-shadow: 0 0 30px rgba(242,177,88,.45), 0 0 80px rgba(228,104,44,.25), 0 2px 0 #2a1504; animation: flick 5s infinite; }
.logo span { font: 500 15px var(--f-latin); letter-spacing: .5em; color: var(--dim); }
@keyframes flick { 0%, 100% { opacity: 1; } 46% { opacity: 1; } 47% { opacity: .8; } 49% { opacity: 1; } 71% { opacity: .92; } 72% { opacity: 1; } }
.lede { margin: 0; font-size: 15px; line-height: 1.75; color: #c9c1b2; max-width: 44ch; }
.menu { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.menu button { all: unset; cursor: pointer; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 1px 12px; align-items: baseline; padding: 9px 12px 9px 6px; border-left: 3px solid transparent; transition: background .15s, border-color .15s; }
.menu button .ar { font: 500 13px var(--f-mono); color: var(--faint); }
.menu button .t { font-size: 18px; font-weight: 700; }
.menu button .s { grid-column: 2; font-size: 12.5px; color: var(--dim); margin-top: 2px; }
.menu button:hover, .menu button:focus-visible { background: rgba(242,177,88,.08); border-left-color: var(--amber); }
.menu button:hover .ar, .menu button:focus-visible .ar { color: var(--amber); }
.menu button[disabled] { opacity: .35; cursor: default; }
.menu button[disabled]:hover { background: none; border-left-color: transparent; }
.foot { font: 400 11.5px var(--f-mono); color: var(--faint); display: flex; gap: 16px; flex-wrap: wrap; }
.wrap { max-width: 1000px; margin: 0 auto; display: grid; gap: 22px; }
.hdr { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; justify-content: space-between; border-bottom: 1px solid var(--rule); padding-bottom: 14px; }
.hdr h2 { margin: 0; font: 400 38px/1.05 var(--f-display); }
.hdr .sub { font-size: 13px; color: var(--dim); margin-top: 6px; }
.souls { font: 600 18px var(--f-mono); color: var(--soul); }
.btn { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border: 1px solid var(--rule); background: var(--slab-2); font-size: 14px; font-weight: 500; transition: border-color .15s, background .15s; white-space: nowrap; }
.btn:hover, .btn:focus-visible { border-color: var(--amber); }
.btn.primary { background: var(--amber); color: #1a1005; border-color: var(--amber); font-weight: 700; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { border-color: rgba(216,68,58,.6); color: #ffb0a6; }
.btn[disabled] { opacity: .4; cursor: default; }
.row-btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.ucard { display: grid; grid-template-rows: auto 1fr auto; gap: 8px; padding: 14px; background: var(--slab); border: 1px solid var(--rule); min-width: 0; }
.ucard h3 { margin: 0; font-size: 15px; }
.ucard p { margin: 0; font-size: 13px; color: #b8b2a6; line-height: 1.55; }
.ucard .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pips { display: flex; gap: 4px; }
.pips i { width: 16px; height: 5px; background: rgba(255,255,255,.12); }
.pips i.on { background: var(--soul); }
.cls { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.ccard { all: unset; cursor: pointer; display: grid; gap: 10px; align-content: start; padding: 18px; background: var(--slab); border: 1px solid var(--rule); min-width: 0; transition: border-color .15s, transform .15s; }
.ccard:hover, .ccard:focus-visible { border-color: var(--amber); transform: translateY(-2px); }
.ccard.locked { cursor: default; opacity: .6; }
.ccard.locked:hover { transform: none; border-color: var(--rule); }
.ccard h3 { margin: 0; font: 400 26px var(--f-display); color: #ffdca6; }
.ccard p { margin: 0; font-size: 13.5px; line-height: 1.6; color: #c4bdb0; }
.ccard dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.5px; }
.ccard dt { color: var(--dim); }
.ccard dd { margin: 0; font-family: var(--f-mono); }
.ccard .sk { font-size: 13px; padding: 8px 10px; border-left: 2px solid var(--amber); background: rgba(242,177,88,.06); line-height: 1.5; }
.ccard .lock { font: 600 12.5px var(--f-mono); color: var(--soul); }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { all: unset; cursor: pointer; padding: 7px 14px; font-size: 14px; border-bottom: 2px solid transparent; color: var(--dim); }
.tabs button[aria-selected="true"] { color: var(--paper); border-bottom-color: var(--amber); }
.list { display: grid; gap: 8px; }
.lrow { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 14px; padding: 12px 14px; background: var(--slab); border: 1px solid var(--rule); font-size: 13.5px; line-height: 1.6; min-width: 0; }
.lrow b { font-size: 14.5px; }
.lrow .c { font: 500 11.5px var(--f-mono); color: var(--dim); display: block; margin-top: 2px; }
.lrow.locked { color: var(--faint); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
.stat { padding: 12px 14px; background: var(--slab); border: 1px solid var(--rule); }
.stat .v { font: 600 24px var(--f-mono); font-variant-numeric: tabular-nums; }
.stat .l { font-size: 12px; color: var(--dim); }
.setrow { display: grid; grid-template-columns: minmax(110px, 200px) minmax(0, 1fr) 60px; gap: 14px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
.setrow input[type=range] { width: 100%; accent-color: var(--amber); }
.setrow .val { font: 500 13px var(--f-mono); text-align: right; color: var(--dim); }
.seg { display: flex; gap: 0; flex-wrap: wrap; }
.seg button { all: unset; cursor: pointer; padding: 6px 12px; border: 1px solid var(--rule); font-size: 13px; color: var(--dim); }
.seg button + button { border-left: 0; }
.seg button[aria-pressed="true"] { color: #1a1005; background: var(--amber); border-color: var(--amber); }
.toggle { all: unset; cursor: pointer; width: 42px; height: 22px; border-radius: 11px; background: var(--rule); position: relative; }
.toggle::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--paper); transition: transform .15s; }
.toggle[aria-checked="true"] { background: var(--moss); }
.toggle[aria-checked="true"]::after { transform: translateX(20px); }
