name: Daily expanded sources

on:
  schedule:
    - cron: '17 23 * * *' # 매일 08:17 KST, 실제 시작은 GitHub 대기열에 따라 지연 가능
  workflow_dispatch:
    inputs:
      recover_enara:
        description: '운영자: 오늘 실패한 e나라도움만 1회 복구 (복지로 한도 우회 불가)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-expanded-sources
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'lsellco2-dot/gov-support' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production-ingestion
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        source: [enara, bokji-central, bokji-local]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Collect or enrich public announcements
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.AISUP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.AISUP_SUPABASE_SERVICE_ROLE_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.AISUP_DATA_GO_KR_KEY }}
          RECOVER_ENARA: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_enara && matrix.source == 'enara' }}
        run: |
          args=(--source=${{ matrix.source }} --apply)
          if [[ "$RECOVER_ENARA" == "true" ]]; then args+=(--recover-enara); fi
          npm run ingest:scheduled -- "${args[@]}"
